# 前端由 Netlify 從 git 自動部署（04 ADR-11）。
# 環境變數 VITE_SUPABASE_URL、VITE_SUPABASE_PUBLISHABLE_KEY 在 Netlify 後台依部署情境設定：
# 正式網站連正式專案，預覽網址與分支部署連測試專案。
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# 單頁應用：找不到的網址都交給 index.html，由前端路由處理
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
