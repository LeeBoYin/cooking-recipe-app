name: Deploy database

# 資料庫 migration 的部署（04 ADR-11）：
# - PR 改到 supabase/ 時：對測試專案試跑（dry run），只列出會套用哪些 migration，不改資料庫
# - 合併到 main 後：先部署到測試專案，成功才部署到正式專案
# 正式專案只透過這個流程部署，不從本機直接推。

on:
  pull_request:
    paths: ["supabase/**"]
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  STAGING_PROJECT_ID: usnsgpcutztcmnjbqopg
  PRODUCTION_PROJECT_ID: dvlfioarakgddstcwfiu

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase link --project-ref "$STAGING_PROJECT_ID" --debug
      - name: 列出會套用到測試專案的 migration
        run: supabase db push --remote --dry-run --password "$DB_PASSWORD"
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}

  staging:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase link --project-ref "$STAGING_PROJECT_ID"
      - run: supabase db push --remote --password "$DB_PASSWORD"
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase link --project-ref "$PRODUCTION_PROJECT_ID"
      - run: supabase db push --remote --password "$DB_PASSWORD"
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
